# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người dùng thật nếu đưa vào dùng — 3 kịch bản, ở quy mô thật của sản phẩm
  low: 50
  base: 200
  high: 500
  source: "(tự ước tính) Giả định số gia đình hoạt động mỗi tháng trong thử nghiệm tại một khu vui chơi, từ nhóm mời nhỏ đến mở rộng theo mùa."

personas:           # ≥3 kiểu người dùng; share cộng lại = 1
  - name: lap_lich_truoc_chuyen_di
    share: 0.65
    uses_per_month: 1
    turns_per_session: 1
    source: "(tự ước tính) Gia đình lập một lịch trước khi đi."
    types: [thuong]
  - name: doi_lich_trong_ngay
    share: 0.25
    uses_per_month: 1
    turns_per_session: 2
    source: "(tự ước tính) Gia đình lập lịch rồi hỏi lại khi mưa hoặc show hủy."
    types: [thuong, kho]
  - name: gia_dinh_di_thuong_xuyen
    share: 0.10
    uses_per_month: 2
    turns_per_session: 2
    source: "(tự ước tính) Gia đình ở gần, chuẩn bị và điều chỉnh cho hai lần đi trong tháng."
    types: [thuong, kho]
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).
# Persona hỏi kiểu riêng: thêm vào persona đó
#     types: [thuong, kho, tu_choi]
# hoặc
#     inputs: ["câu hỏi kiểu 1", "câu hỏi kiểu 2"]

prices:             # USD / 1 triệu token — chép từ further-reading/model-prices.md của repo đề. ≥2 mức model
  - model: gemini-3.1-flash-lite
    input: 0.25
    output: 1.50
    source: "Bảng giá BTC ngày 25/11/2026 · https://aistudio.google.com/docs/pricing#gemini-3.1-flash-lite"
  - model: gemini-4-hydrogen
    input: 1.50
    output: 7.50
    source: "Bảng giá BTC ngày 25/11/2026 · https://aistudio.google.com/docs/pricing#gemini-4-hydrogen"

usd_to_vnd:         # tuỳ chọn: điền thì bản tóm tắt in thêm tiền Việt
  rate:
  source:
